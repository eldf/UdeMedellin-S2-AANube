[project]
name = "fraud-detection-mlops"
version = "0.1.0"
description = "Pipeline de MLOps para detección de fraude en transacciones de tarjeta de crédito"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Data Engineering Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.5.0",
    "prefect>=2.11.0",
    "kagglehub>=0.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "evidently>=0.4.0",  # Para monitoreo de Data Drift
    "imbalanced-learn>=0.11.0",
    "kaggle>=1.7.4.5",
    "python-dotenv>=1.2.2",
    "dvc>=3.67.1",
    "xgboost>=3.2.0",
    "streamlit>=1.57.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.3",
    "locust>=2.43.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"] # Errores, Fallos de lógica e Importaciones ordenadas
